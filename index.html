<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Faerie's Fortune - Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cpolygon points=%2750,6 90,30 90,70 50,94 10,70 10,30%27 fill=%27%23E8B93E%27 stroke=%27%238C6B32%27 stroke-width=%274%27/%3E%3Ctext x=%2750%27 y=%2763%27 font-family=%27Georgia%27 font-weight=%27900%27 font-size=%2740%27 text-anchor=%27middle%27 fill=%27%231C1712%27%3E20%3C/text%3E%3C/svg%3E">
</head>
<body class="auth-page">

<div class="stage stage-narrow">
  <header>
    <p class="eyebrow">The Gaming Table</p>
    <h1>The Faerie's <span>Fortune</span></h1>
  </header>

  <div class="auth-card" id="authCard">
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Log In</button>
      <button class="auth-tab" id="tabSignup" role="tab" aria-selected="false">Sign Up</button>
    </div>

    <div id="loginForm">
      <div class="party-form" style="flex-direction:column;">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="die-btn" id="loginBtn">Log In</button>
      </div>
    </div>

    <div id="signupForm" style="display:none;">
      <div class="party-form" style="flex-direction:column;">
        <input type="text" id="signupName" placeholder="Your name" maxlength="30" autocomplete="nickname">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (6+ characters)" autocomplete="new-password">
        <button class="die-btn" id="signupBtn">Create Account</button>
      </div>
    </div>

    <p class="party-hint auth-status" id="authStatus"></p>
  </div>

  <p class="party-hint" style="text-align:center; margin-top:18px;">
    Once you're in, you can create a party as its Dungeon Master, or join one as a Player with an invite code.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=5"></script>
<script src="supabase-client.js?v=5"></script>
<script src="login.js?v=5"></script>
</body>
</html>
